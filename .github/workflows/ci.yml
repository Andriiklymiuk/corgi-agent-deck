name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx streamdeck validate com.andriiklymiuk.agent-deck.sdPlugin

  release:
    # A release is a version bump on main: when package.json names a version
    # with no tag yet, tag it, pack the plugin with that version and publish.
    # The .streamDeckPlugin is what a person double-clicks or uploads to the
    # Elgato Marketplace (docs/MARKETPLACE.md); no secret beyond GITHUB_TOKEN.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version from package.json, skip when already tagged
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already released"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.new == 'true'
        run: npm run build
      - if: steps.version.outputs.new == 'true'
        run: npx streamdeck pack com.andriiklymiuk.agent-deck.sdPlugin --force --version "${{ steps.version.outputs.version }}.0"
      - if: steps.version.outputs.new == 'true'
        name: Changelog since the previous tag
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi
          git log --no-merges --pretty=format:"- %s (%h)" $RANGE > RELEASE_NOTES.md
      - if: steps.version.outputs.new == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
      - if: steps.version.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: "*.streamDeckPlugin"
